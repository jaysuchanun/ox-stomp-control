<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OX Stomp Control</title>
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OX Stomp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#141210; --panel:#1f1b17; --panel2:#29241e; --line:#3a3229;
  --text:#efe6d8; --muted:#a8998a; --accent:#d9a441; --accent2:#c0553a; --ok:#6fae6a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#1b1714,#141210);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--accent2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,input[type=number],button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600}
button.on{background:var(--accent);color:#1a1408;border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
section h2{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.row{display:grid;grid-template-columns:110px 1fr 76px;gap:8px;align-items:center;margin:8px 0}
.row label{color:var(--muted);font-size:13px}
.row .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;width:100%;box-sizing:border-box;
  background:transparent;color:var(--text);border:1px solid transparent;border-radius:6px;padding:3px 5px;font-family:inherit}
.row input.val{text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:text}
.row .val:hover{border-color:var(--line)}
.row input.val:focus{text-decoration:none}
.row .val:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.row select{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:-2px;line-height:1}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.toggles button{font-size:13px;padding:6px 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cc{color:#6f6458;font-size:11px;margin-left:4px}
#log{grid-column:1/-1;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.rigs{display:grid;gap:8px}
.rig{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.rig b{font-size:14px}.rig .meta{font-size:12px;color:var(--muted);grid-column:1/-1}
.rig .acts{display:flex;gap:6px}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:8px}
.eqgrid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.eqgrid input,.eqgrid select{width:100%}
.eqgrid input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#3a2a1c;color:var(--accent);margin-left:6px}
.tag{font-size:10px;margin-left:5px;padding:1px 5px;border-radius:5px;vertical-align:1px}
.tag.rig{background:#2b3440;color:#9db8d6}
#live{grid-column:1/-1}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin-top:6px}
.livegrid .k{font-size:12px;color:var(--muted)} .livegrid .v{font-size:16px;font-weight:600}
.leds{display:flex;gap:18px;align-items:center}
.led{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.led i{width:16px;height:16px;border-radius:50%;background:#3a3a3a;box-shadow:inset 0 0 0 1px #0006;display:inline-block}
.meter{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--accent);width:0}
.row.nomidi input[type=range]{accent-color:#7f9cc0}
button.nomidi.on{background:#7f9cc0;border-color:#7f9cc0;color:#0f1620}
input[type=range]:disabled{opacity:.45}
@media (max-width:480px){.row{grid-template-columns:84px 1fr 70px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>OX <span>Stomp</span> Control</h1><span id="status" class="status">Not connected</span></div>
  <div class="bar">
    <button id="connect" class="primary">Connect MIDI</button>
    <select id="output" title="MIDI output"><option value="">— no output —</option></select>
    <label class="status">Ch <select id="channel"></select></label>
    <button id="saveRigBtn" hidden title="Store the pedal's current sound in the Rig it's on — like Save in UAFX Control">Save to Rig</button>
    <button id="serialBtn" title="Two-way link over the pedal's USB port: reads its live state and sets every control, Rig settings included (Chrome/Edge)">USB link</button>
    <button id="sendAll" title="Send every value on screen to the pedal">Send all</button>
    <select id="snapList" title="Saved snapshots"><option value="">Snapshots…</option></select>
    <button id="snapLoad">Load</button>
    <button id="snapSave">Save</button>
    <button id="snapDel">Delete</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <input id="importFile" type="file" accept=".json" hidden>
  </div>
</header>
<main id="main"></main>

<script>
// ---- Parameter map: UA OX Stomp manual, "OX Stomp MIDI CCs" (firmware 2.0+) ----
const CABS = ["1x10 Black Cha","1x12 Black GB30","1x12 Black D-UX","1x12 JBG125","1x12 Blu 15","1x12 GB25","1x12 Blue J","2x10 V-UX","2x12 Ace Top","2x12 Alnico 50","2x12 Black 8h","2x12 D65","2x12 Two Verb","2x12 JBF120","4x10 BMan","4x12 GB30",
  // 16–21: UA's CC table is truncated after 15; this order is confirmed by UAFX Control 2.3.0's own OX cab list
  "4x12 UK Vee 30","4x12 CA Vee 30","4x12 Super 80","4x12 GB25 Punch","4x12 GB25 Thick","4x12 White 75"];
const MICS = ["Dynamic 421","Dynamic 57","Condenser 414","Ribbon 160","Ribbon 121","Condenser 67","Direct Box"];
const ROOMS = ["Condenser Stereo","Ribbon Stereo","Condenser Mono","Condenser 67 Mono","Ribbon 84 Mono","Ribbon 121 Mono"];

const SECTIONS = [
  {title:"Rig & Master", params:[
    {id:"output",cc:7,label:"Output",type:"range",def:96,unit:"pct",ends:["off","max"]},
    {id:"drive",cc:21,label:"Speaker Drive",type:"range",def:40,unit:"pct"},
    {id:"cab",cc:20,label:"Cabinet",type:"select",options:CABS,def:15},
  ]},
  {title:"Mic 1", params:[
    {id:"m1",cc:22,label:"Model",type:"select",options:MICS,def:1},
    {id:"m1vol",cc:23,label:"Volume",type:"range",def:96,unit:"pct",ends:["off","max"]},
    {id:"m1pan",cc:24,label:"Pan",type:"range",def:64,pan:true,ends:["L","R"]},
    {id:"m1mute",cc:25,label:"Mute",type:"toggle",def:0},
    {id:"m1axis",cc:26,label:"On Axis",type:"toggle",def:1},
    {id:"m1lc",cc:27,label:"Low Cut",type:"toggle",def:0},
  ]},
  {title:"Mic 2", params:[
    {id:"m2",cc:28,label:"Model",type:"select",options:MICS,def:4},
    {id:"m2vol",cc:29,label:"Volume",type:"range",def:80,unit:"pct",ends:["off","max"]},
    {id:"m2pan",cc:30,label:"Pan",type:"range",def:64,pan:true,ends:["L","R"]},
    {id:"m2mute",cc:31,label:"Mute",type:"toggle",def:0},
    {id:"m2axis",cc:32,label:"On Axis",type:"toggle",def:1},
    {id:"m2lc",cc:33,label:"Low Cut",type:"toggle",def:0},
  ]},
  {title:"Room", params:[
    {id:"room",cc:34,label:"Room Mic",type:"select",options:ROOMS,def:0},
    {id:"roomlvl",cc:35,label:"Level",type:"range",def:40,unit:"pct",ends:["off","max"]},
    {id:"roompan",cc:36,label:"Pan",type:"range",def:64,pan:true,ends:["L","R"]},
    {id:"roommute",cc:37,label:"Mute",type:"toggle",def:0},
    {id:"roomdamp",cc:38,label:"Damp",type:"toggle",def:0},
    {id:"roomlc",cc:39,label:"Low Cut",type:"toggle",def:0},
  ]},
  {title:"Master EQ", note:"Post-cabinet EQ for the whole Rig, laid out like UAFX Control. Band frequencies for the Default Rig: Low 120 Hz · Low-Mid 400 Hz · Mid 900 Hz · High 4 kHz (they vary per Rig and the app doesn't expose them).", params:[
    {id:"eqon",label:"Master EQ",type:"toggle",def:1,nomidi:true},
    {id:"eqhigh",label:"High · 4k",type:"range",def:64,unit:"db10",nomidi:true,ends:["-10 dB","+10 dB"]},
    {id:"eqmid",label:"Mid · 900",type:"range",def:64,unit:"db10",nomidi:true,ends:["-10 dB","+10 dB"]},
    {id:"eqlomid",label:"Low-Mid · 400",type:"range",def:64,unit:"db10",nomidi:true,ends:["-10 dB","+10 dB"]},
    {id:"eqlow",label:"Low · 120",type:"range",def:64,unit:"db10",nomidi:true,ends:["-10 dB","+10 dB"]},
    {id:"eqhion",label:"High band",type:"toggle",def:1,nomidi:true},
    {id:"eqmidon",label:"Mid band",type:"toggle",def:1,nomidi:true},
    {id:"eqlomidon",label:"Low-Mid band",type:"toggle",def:1,nomidi:true},
    {id:"eqlowon",label:"Low band",type:"toggle",def:1,nomidi:true},
    {id:"eqhicut",label:"High Cut",type:"range",def:127,unit:"hiCut",nomidi:true,ends:["20 Hz","off"]},
    {id:"eqlocut",label:"Low Cut",type:"range",def:0,unit:"loCut",nomidi:true,ends:["off","16 kHz"]},
  ]},
  {title:"1176 Compressor", note:"Applied to the whole Rig. As on a real 1176, Attack and Release get faster as the number goes up.", params:[
    {id:"cmpon",label:"Compressor",type:"toggle",def:0,nomidi:true},
    {id:"cmpin",label:"Input",type:"range",def:48,unit:"pct",nomidi:true,ends:["off","max"]},
    {id:"cmpout",label:"Output",type:"range",def:64,unit:"pct",nomidi:true,ends:["off","max"]},
    {id:"cmpatk",label:"Attack",type:"range",def:64,unit:"atk1176",nomidi:true,ends:["slow","fast"]},
    {id:"cmprel",label:"Release",type:"range",def:64,unit:"rel1176",nomidi:true,ends:["slow","fast"]},
    {id:"cmpratio",label:"Ratio",type:"select",options:["4:1","8:1","12:1","20:1","All"],def:0,nomidi:true},
  ]},
  {title:"Delay", note:"Full delay layout from UAFX Control. Controls tagged CC change the pedal over MIDI; controls tagged Rig have no MIDI CC — they change the pedal live once it's linked (USB link). Over MIDI only, they're kept with your snapshots as a record.", params:[
    {id:"dly",cc:40,label:"Enable",type:"toggle",def:1},
    {id:"dmode",label:"Mode",type:"select",options:["Dual","Crossover","Ping Pong","Chorus","Flanger"],def:0,nomidi:true},
    {id:"dlytime",cc:41,label:"Time A",type:"range",def:22,unit:"delayTime",ends:()=>["0.14 ms",delayMaxLabel()]},
    {id:"dlytimeb",label:"Time B",type:"range",def:22,unit:"delayTime",nomidi:true,linkedTo:"dlytime",linkKey:"dlink",ends:()=>["0.14 ms",delayMaxLabel()]},
    {id:"dlink",label:"Link Delay Times",type:"toggle",def:1,nomidi:true},
    {id:"dpana",label:"Pan A",type:"range",def:0,pan:true,nomidi:true,ends:["L","R"]},
    {id:"dpanb",label:"Pan B",type:"range",def:127,pan:true,nomidi:true,mirrorOf:"dpana",linkKey:"dlinkpan",ends:["L","R"]},
    {id:"dlinkpan",label:"Link Pan",type:"toggle",def:1,nomidi:true},
    {id:"dlyfb",cc:42,label:"Feedback",type:"range",def:88,unit:"bipolar",exact:true,appUnit:true,ends:["-100%","+100%"]},
    {id:"dlymix",cc:44,label:"Mix",type:"range",def:74,unit:"bipolar",exact:true,appUnit:true,ends:["-100%","+100%"]},
    {id:"dlfo",label:"LFO Shape",type:"select",options:["Sine 0","Sine 90","Sine 180","Tri 0","Tri 90","Tri 180"],def:0,nomidi:true},
    {id:"dmodrate",label:"Mod Rate",type:"range",def:0,unit:"offPct",nomidi:true,ends:["off","max"]},
    {id:"dmoddepth",label:"Mod Depth",type:"range",def:0,unit:"offPct",nomidi:true,ends:["off","max"]},
    {id:"dhicut",label:"High Cut",type:"range",def:99,unit:"hiCut",nomidi:true,ends:["20 Hz","off"]},
    {id:"dlocut",label:"Low Cut",type:"range",def:40,unit:"loCut",nomidi:true,ends:["off","16 kHz"]},
  ]},
  {title:"Reverb", note:"Stereo plate reverb on the whole Rig. UA notes the Mix control is 15% wet at its halfway point for finer low-level control.", params:[
    {id:"rev",cc:60,label:"Enable",type:"toggle",def:0},
    {id:"revtime",cc:61,label:"Decay",type:"range",def:50,unit:"revTime",ends:["0.5 s","5.5 s"]},
    {id:"revpre",label:"Pre-Delay",type:"range",def:0,unit:"preDelay",nomidi:true,ends:["0 ms","250 ms"]},
    {id:"revbal",label:"Balance",type:"range",def:64,pan:true,nomidi:true,ends:["L","R"]},
    {id:"revmix",cc:63,label:"Mix",type:"range",def:40,unit:"revMix",ends:["dry","wet"]},
    {id:"revtreb",label:"Treble",type:"range",def:64,unit:"bipolar",nomidi:true,ends:["cut","boost"]},
    {id:"revbass",label:"Bass",type:"range",def:64,unit:"bipolar",nomidi:true,ends:["cut","boost"]},
  ]},
];
const PARAMS = SECTIONS.flatMap(s=>s.params);
const state = {pc:null, bypass:null}; // bypass: last CC19 sent; the pedal never reports its real state
PARAMS.forEach(p=>state[p.id]=p.def);

// ---- MIDI ----
let midi=null, out=null;
const $ = id=>document.getElementById(id);
const chSel=$("channel");
for(let i=1;i<=16;i++) chSel.add(new Option(i,i-1));
try{const c=localStorage.getItem("oxStompChannel");if(c!==null)chSel.value=c;}catch{}
chSel.onchange=()=>{try{localStorage.setItem("oxStompChannel",chSel.value);}catch{}};
function setStatus(t,cls){const s=$("status");s.textContent=t;s.className="status "+(cls||"");}
function log(t){const l=$("log");l.textContent=(new Date().toLocaleTimeString()+"  "+t+"\n"+l.textContent).slice(0,6000);}
function ch(){return Number(chSel.value)||0;}
function sendCC(cc,v,label){
  v=Math.max(0,Math.min(127,Math.round(v)));
  if(!out){log(`(not sent) CC${cc}=${v} ${label||""}`);return;}
  out.send([0xB0|ch(),cc,v]); log(`CC${cc} = ${v}  ${label||""}`);
}
function sendPC(n){
  if(n==null||n==="")return;
  if(!out){log(`(not sent) PC ${n}`);return;}
  out.send([0xC0|ch(),Number(n)&127]); log(`Program Change ${n}`);
}
function refreshOutputs(){
  const sel=$("output"), prev=sel.value; sel.innerHTML='<option value="">— no output —</option>';
  if(!midi)return;
  for(const o of midi.outputs.values()) sel.add(new Option(o.name,o.id));
  let saved=null;try{saved=localStorage.getItem("oxStompOutputName");}catch{}
  const pick=[...midi.outputs.values()].find(o=>o.id===prev)||[...midi.outputs.values()].find(o=>saved&&o.name===saved)||[...midi.outputs.values()].find(o=>/ox|uafx|universal/i.test(o.name));
  if(pick)sel.value=pick.id;
  selectOutput();
}
function selectOutput(){
  out=midi?midi.outputs.get($("output").value)||null:null;
  if(out){try{localStorage.setItem("oxStompOutputName",out.name);}catch{}}
  if(out)setStatus("Connected: "+out.name,"ok");
  else setStatus(midi?(midi.outputs.size?"Choose an output":(window.webkit?.messageHandlers?.midi?"Plug in the OX Stomp (USB-C)":"No MIDI outputs found — check USB cable / close UA Connect")):"Not connected", midi&&!midi.outputs.size?"err":"");
}
async function connectMIDI(){
  if(!navigator.requestMIDIAccess){setStatus("This browser has no Web MIDI — use Chrome or Edge","err");return;}
  // Chrome waits silently if its permission prompt was missed or dismissed — say so instead of doing nothing
  setStatus("Waiting for MIDI permission…");
  const hint=setTimeout(()=>{if(!midi)setStatus("No MIDI permission yet — allow \"MIDI devices\" in the address bar's site settings, then reload","err");},4000);
  try{midi=await navigator.requestMIDIAccess();midi.onstatechange=refreshOutputs;refreshOutputs();}
  catch(e){setStatus("MIDI access denied — allow \"MIDI devices\" in the address bar's site settings, then reload","err");log("requestMIDIAccess: "+e.message);}
  finally{clearTimeout(hint);}
}
$("connect").onclick=connectMIDI;
$("output").onchange=selectOutput;

// ---- UI ----
// Estimated unit conversions. UA publishes the end points (shown in UAFX Control) but not the
// curve between them, so these are approximations, marked "≈" in the UI.
const hz=f=>f>=1000?(f/1000).toFixed(f>=10000?0:1)+" kHz":Math.round(f)+" Hz";
const UNITS = {
  // 0.14 ms – 3 s, assumed logarithmic (typical for delay-time controls)
  // Max depends on Mode (UAFX Control: Dual/Crossover/Ping Pong 3 s, Chorus 125 ms, Flanger 45 ms)
  delayTime:v=>{const ms=0.14*Math.pow(delayMaxMs()/0.14,v/127);return ms>=1000?(ms/1000).toFixed(2)+" s":ms>=10?Math.round(ms)+" ms":ms.toFixed(1)+" ms";},
  // -100% … +100%, centre = 0 (app labels)
  bipolar:v=>{const p=Math.round((v-64)/63*100);return (p>0?"+":"")+Math.max(-100,Math.min(100,p))+"%";},
  // Manual: reverb mix is 15% wet at the halfway point → piecewise-linear guess
  revMix:v=>{const w=v<=64?v/64*15:15+(v-64)/63*85;return Math.round(w)+"% wet";},
  pct:v=>Math.round(v/127*100)+"%",
  // Plate: Decay 0.5–5.5 s, Pre-Delay 0–250 ms (UAFX Control's end labels; linear assumed)
  revTime:v=>(0.5+5*v/127).toFixed(1)+" s",
  preDelay:v=>Math.round(v/127*250)+" ms",
  db10:v=>{const d=Math.round((v-64)/63*100)/10;const c=Math.max(-10,Math.min(10,d));return (c>0?"+":"")+c.toFixed(1)+" dB";},
  // 1176: attack ≈800 µs (slow, 1) → ≈20 µs (fast, 7); release ≈1.1 s (1) → ≈50 ms (7)
  atk1176:v=>{const us=800*Math.pow(20/800,v/127);return Math.round(us)+" µs";},
  rel1176:v=>{const ms=1100*Math.pow(50/1100,v/127);return ms>=1000?(ms/1000).toFixed(2)+" s":Math.round(ms)+" ms";},
  offPct:v=>v===0?"off":Math.round(v/127*100)+"%",
  // High Cut: 20 Hz … off (top of travel = off), Low Cut: off … 16 kHz — log sweep assumed
  hiCut:v=>v>=127?"off":hz(20*Math.pow(1000,v/127)),
  loCut:v=>v<=0?"off":hz(20*Math.pow(800,v/127)),
};
// ---- Typed values: every slider's value box takes a value in plain units ("350 ms", "1.2 s", "-3 dB", "L20", "off") ----
// One number in the display's base unit: "1.2 s" → 1200 (ms), "4k" / "4 kHz" → 4000 (Hz), "L20" → -20
function parseVal(t){t=String(t).trim().replace(/^≈/,"");if(/^c(entre|enter)?$/i.test(t))return 0;
  const m=t.match(/^([LR])?\s*([-+]?\d*\.?\d+)\s*(khz|k|ms|µs|us|s|hz)?/i);if(!m)return null;
  let n=parseFloat(m[2]);const u=(m[3]||"").toLowerCase();
  if((m[1]||"").toUpperCase()==="L"||/\dL$/i.test(t.replace(/\s/g,"")))n=-n;if(u==="s"||u==="k"||u==="khz")n*=1000;return n;}
// What kind of value a text is, so "369" can be read in the pedal's own unit and "100 µs" isn't compared with a knob number
function unitOf(t){t=String(t).trim();
  if(/(ms|µs|us)$|\d\s*s$/i.test(t))return"time";if(/hz$|\d\s*k$/i.test(t))return"freq";if(/db$/i.test(t))return"db";
  if(/%/.test(t))return"pct";if(/^[LR]\s*\d|\d\s*[LR]$|^c$/i.test(t))return"pan";return"";}
// Page value (0–127) whose estimated display is closest to the typed text; null if it can't be read
function fromText(p,t){
  if(/^off$/i.test(t.trim())){for(const v of[0,127])if(fmt(p,v)==="off")return v;return null;}
  const want=parseVal(t);if(want==null)return null;let best=null,err=Infinity;
  for(let v=0;v<=127;v+=0.05){const g=parseVal(fmt(p,v));if(g!=null&&Math.abs(g-want)<err){err=Math.abs(g-want);best=v;}}
  return best;}
// Linked: the pedal's display is the truth (its curves aren't published, and it doesn't parse "369ms" the way you'd
// hope — it went to 2.37 s). So set the control, read back the pedal's own text, and home in on the typed value:
// start from the page's estimate, then regula falsi (Illinois) on the normalized value, ≤ 10 steps of a few ms each.
// The deviced control behind page control p, and its current {n: normalized, s: pedal's display text}
const ctlPath=p=>liveWrites(p,64,state).map(w=>w[0]).find(x=>!/_enable\//.test(x)).replace(/\/normalized_value\/value$/,"");
async function readCtl(ctl){const pr=(await uanet.get(ctl,DEVICED_PORT,true)).properties;return{n:+pr.normalized_value.value,s:String(pr.string_value.value).trim()};}
async function seekPedal(p,want){

  // half a step of the pedal's display ("420 ms" → 0.5 ms, "1.9 s" → 50 ms)
  const tol=t=>{const m=t.match(/\d+(?:\.(\d+))?/);return m?0.5*10**-(m[1]?.length??0)*(/\d\s*(s|k|khz)$/i.test(t)?1000:1)+1e-9:0;};

  const take=r=>{const g=parseVal(r.s),f=(g==null?(r.n<.5?-Infinity:Infinity):g-want);const q={...r,f};
    if(f<=0&&r.n>=lo.n){lo=q;if(side===-1)hi.f/=2;side=-1;}if(f>=0&&r.n<=hi.n){hi=q;if(side===1)lo.f/=2;side=1;}

async function typeValue(p,t){

    try{
      const now=(await readCtl(ctlPath(p))).s,tu=unitOf(t),pu=unitOf(now);
      // A bare number is read in the pedal's displayed unit: "369" → ms, "2" on a "1.9 s" control → s, "4" on "5.85 k" → kHz
      let want=parseVal(t);
      if(want!=null&&!tu&&pu==="time"&&/\d\s*s$/.test(now)&&want<=10)want*=1000;
      if(want!=null&&!tu&&pu==="freq"&&/k$/i.test(now)&&want<=25)want*=1000;
      // Typed in a unit the pedal doesn't show here (e.g. µs on the 1176's 1–7 knob) → page estimate, no seeking

        const b=await seekPedal(p,want);

        const miss=Math.abs(b.f)>0.03*Math.abs(want)+1e-6;

        setStatus(`${p.label}: ${b.s}`+(miss?` — closest to ${t} the pedal goes`:""),miss?"err":"ok");return;}
    }catch(e){log(`Couldn't set ${label} on the pedal (${e.message}) — using the estimate`);}
  }
  const v=fromText(p,t);
  if(v==null){log(`Couldn't read "${t}" as a value for ${p.label}`);paint(p);return;}
  state[p.id]=uanet?v:Math.round(v);delete liveText[p.id];sendParam(p,label);applyLinks();paint(p);
}
const delayMaxMs=()=>[3000,3000,3000,125,45][state.dmode??0]??3000;
const delayMaxLabel=()=>{const m=delayMaxMs();return m>=1000?m/1000+" s":m+" ms";};
function fmt(p,v){

// ---- Rig Library: a saved Rig = every value on this page + its Program Change slot ----
const RIGKEY="oxStompRigLib";

function rigSummary(r){
  const st=r.state; if(!st)return r.notes||"";
  const v=id=>fmt(P(id),st[id]??P(id).def).replace("≈","");
  const parts=[CABS[st.cab]??"",`${MICS[st.m1]} + ${MICS[st.m2]}`];
  if(st.eqon){const bands=[["eqlow","L"],["eqlomid","LM"],["eqmid","M"],["eqhigh","H"]].filter(([k])=>st[k]!==64).map(([k,l])=>`${l} ${v(k)}`);parts.push("EQ "+(bands.join(" ")||"flat"));}
  if(st.cmpon)parts.push("1176 "+P("cmpratio").options[st.cmpratio]);

async function post(path,data,port=DEVICED_PORT){
  const r=await uanet.req({action:3,pathId:await uanet.pathId(path,port),data,params:pbB(10,pbS("_promise_post"))});
  if(r.error)throw new Error(r.error);return r.data;}
async function saveRig(){
  if(!uanet){setStatus("Click USB link first — saving to the pedal needs the link","err");return;}
  try{
    const idx=Number(await uanet.get("/panel/emperor_state/current_rig_index/value")),uid=plain(await uanet.get(`/panel/emperor_state/rig_uid_${idx+1}/value`));
    if(!uid)throw new Error("the pedal didn't say which Rig it's on");
    if(FACTORY_RIGS.includes(uid)){setStatus(`Rig ${idx+1} is a UA factory Rig — it can't be overwritten. Use Save Copy in UAFX Control`,"err");return;}
    const base=await findPresetFolder(uid),name=String(plain(await uanet.get(`${base}/presets/${uid}/preset_name`,DEVICED_PORT,true))??"");
    if(!confirm(`Save the pedal's current sound into Rig ${idx+1} "${name}"?\n\nThis replaces what's stored in that Rig.`))return;
    await post(`${base}/save`,{preset_uid:uid,session_uid:OX_SESSION,outputs:true});
    await uanet.set("/panel/emperor_state/current_preset_modified/value",false,UANET_PORT);
    try{await post(`${base}/delete_modified`,{uid});}catch(e){log("delete_modified: "+e.message);}
    setStatus(`Saved to Rig ${idx+1} "${name}"`,"ok");log(`Saved the pedal's sound to Rig ${idx+1} "${name}" (${uid})`);
  }catch(e){setStatus("Couldn't save the Rig: "+e.message,"err");log(`Save to Rig failed: ${e.message}`);}
}
$("saveRigBtn").onclick=saveRig;
if(!("serial" in navigator))$("serialBtn").style.display="none";
// Live writes, latest value wins per path so a dragged slider doesn't queue up a backlog
const writing=new Map();
async function writePath(path,value,port){
  if(writing.has(path)){writing.set(path,{value,port});return;}
  writing.set(path,null);
  try{for(let next={value,port};next;next=writing.get(path),writing.set(path,null)){
    try{await uanet?.set(path,next.value,next.port);}catch(e){log(`Write failed: ${path.split("/").slice(-3,-2)} — ${e.message}`);}}}
  finally{writing.delete(path);}
}
// A control changed: write it live when linked, otherwise send its MIDI CC
function sendParam(p,label){
  const w=uanet?liveWrites(p,state[p.id],state):[];
  if(w.length){for(const[path,v,port]of w)writePath(path,v,port);log(`Set ${label}`);return;}
  if(!p.nomidi)sendCC(p.cc,state[p.id],label);
}

build();applyLinks();paintAll();refreshSnaps();
// Inside the iPhone app: connect automatically and hide the Connect button — just plug in the pedal
if(window.webkit?.messageHandlers?.midi){$("connect").style.display="none";setStatus("Plug in the OX Stomp…");connectMIDI();}

// ---- Installable PWA: offline cache when served over http(s); skipped in the iOS wrapper (file://) ----
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e)));
}
</script>
